services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: veridical
      POSTGRES_USER: veridical
      POSTGRES_PASSWORD: veridical-dev-only
    ports: ["5432:5432"]
    volumes: ["veridical-postgres:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U veridical -d veridical"], interval: 5s, timeout: 3s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: veridical
      MINIO_ROOT_PASSWORD: veridical-dev-only
    ports: ["9000:9000", "9001:9001"]
    volumes: ["veridical-minio:/data"]
    healthcheck: { test: ["CMD", "mc", "ready", "local"], interval: 5s, timeout: 3s, retries: 10 }
volumes:
  veridical-postgres:
  veridical-minio:
