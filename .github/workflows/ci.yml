name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm test:regression
      - run: pnpm audit --prod --audit-level=moderate
      - run: node packages/server/scripts/smoke-production.mjs
      - run: node packages/server/scripts/package-runtime.mjs "$RUNNER_TEMP/veridical-runtime"
      - run: node packages/server/scripts/smoke-production.mjs
        env:
          VERIDICAL_SMOKE_BUNDLE: ${{ runner.temp }}/veridical-runtime/dist/server.cjs
