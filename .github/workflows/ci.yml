name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Node 22 is the verified runtime target. Node 24 currently breaks
        # jsdom/React Router navigation tests through a cross-realm AbortSignal
        # incompatibility in undici; keep it out of the release gate until the
        # dependency stack publishes a compatible fix.
        node: ['22']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start infrastructure dependencies
        run: docker compose -f docker-compose.infrastructure.yml up -d --wait
      - name: Verify infrastructure adapters
        run: pnpm test:infrastructure
      - name: Verify PostgreSQL production business path
        run: pnpm test:production:postgres
        env:
          VERIDICAL_POSTGRES_URL: postgres://veridical:veridical-dev-only@127.0.0.1:5432/veridical
          VERIDICAL_REDIS_URL: redis://127.0.0.1:6379
          VERIDICAL_S3_ENDPOINT: http://127.0.0.1:9000
          VERIDICAL_S3_BUCKET: veridical-artifacts
      - name: Verify PostgreSQL migration and rollback
        run: pnpm test:production:migration
        env:
          VERIDICAL_POSTGRES_URL: postgres://veridical:veridical-dev-only@127.0.0.1:5432/veridical
      - run: pnpm format:check
      - run: pnpm test:regression
      - name: Verify production hardening
        run: pnpm test:production
      - run: pnpm audit --prod --audit-level=moderate
      - run: node packages/server/scripts/smoke-production.mjs
      - run: node packages/server/scripts/package-runtime.mjs "$RUNNER_TEMP/veridical-runtime"
      - run: node packages/server/scripts/smoke-production.mjs
        env:
          VERIDICAL_SMOKE_BUNDLE: ${{ runner.temp }}/veridical-runtime/dist/server.cjs
      - name: Stop infrastructure dependencies
        if: always()
        run: docker compose -f docker-compose.infrastructure.yml down -v
